# Written by Kone Tshivhinda (Claude Sonnet 5.5) on 2026-10-15 - Publishes the site/ folder to GitHub Pages whenever main changes.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let a running deployment finish rather than cancel it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Validate the published folder (privacy, links, images)
        run: python3 scripts/validate-compliance.py --no-git

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the site/ folder
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
